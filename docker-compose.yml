services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: schemint
      POSTGRES_PASSWORD: schemint
      POSTGRES_DB: schemint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemint"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://schemint:schemint@db:5432/schemint
      ENV: development
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro

  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: schemint_test
      POSTGRES_PASSWORD: schemint_test
      POSTGRES_DB: schemint_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemint_test"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
